services:
  threadfs-api:
    image: ${THREADFS_IMAGE}
    container_name: threadfs-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    ports:
      - "127.0.0.1:8000:8000"
    command:
      - sh
      - -c
      - |
        alembic upgrade head &&
        exec gunicorn app.main:app \
          --worker-class uvicorn.workers.UvicornWorker \
          --workers ${WEB_CONCURRENCY:-2} \
          --bind 0.0.0.0:8000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health'')"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Rate limit counters, shared between workers. Nothing here needs keeping, so it never touches disk
  redis:
    image: redis:7-alpine
    container_name: threadfs-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru
